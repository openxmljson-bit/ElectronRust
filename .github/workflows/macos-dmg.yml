name: macOS DMG (per-arch)

on:
  push:
    tags: ["v*"]           # build/publish on version tags
  workflow_dispatch: {}     # and on-demand from the Actions tab

permissions:
  contents: write           # attach the DMG to a Release on tags

env:
  HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
  HAS_NOTARY: ${{ secrets.MACOS_NOTARY_PASSWORD != '' }}
  HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN != '' }}

# Separate per-architecture builds. The DuckDB native addon is prebuilt and
# architecture-specific, so each DMG is built on a runner of its own arch to
# pick up the matching @duckdb binary (a universal build can't carry both).
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14            # Apple Silicon
            rust-target: aarch64-apple-darwin
          - arch: x64
            runner: macos-13            # Intel
            rust-target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Build engine (${{ matrix.arch }})
        run: |
          set -euo pipefail
          cd rust-engine
          cargo build --release --target ${{ matrix.rust-target }}
          mkdir -p target/release
          cp target/${{ matrix.rust-target }}/release/openjsonxml-engine target/release/openjsonxml-engine

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Build DuckDB engine bundle
        run: npm run build:duck

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # ---- signing (only when the cert secrets are configured) ----
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Sign engine binary
        if: env.HAS_CERT == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$SIGN_IDENTITY" \
            rust-engine/target/release/openjsonxml-engine
          codesign -dv rust-engine/target/release/openjsonxml-engine

      # ---- package + publish ----
      # electron-builder signs/notarizes the app (including the unpacked DuckDB
      # addon) and, on a tag with the releases token, publishes the DMG + zip +
      # update metadata to the public ElectronRust-Releases repo.
      - name: Build DMG (${{ matrix.arch }})
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          ARGS="--mac --${{ matrix.arch }}"
          if [ "$HAS_CERT" != "true" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false   # unsigned dev build
          fi
          if [ "$HAS_NOTARY" != "true" ] || [ "$HAS_CERT" != "true" ]; then
            ARGS="$ARGS -c.mac.notarize=false"
          fi
          # Never publish from the per-arch jobs — the release job merges the two
          # latest-mac.yml manifests and uploads everything once.
          npx electron-builder $ARGS --publish never
          ls -la dist/

      - name: Upload dist (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  # Merge the per-arch update manifests and publish all assets once, so
  # electron-updater serves both architectures from a single latest-mac.yml.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install js-yaml (for the merge script)
        run: npm i js-yaml --no-save --no-audit --no-fund

      - name: Download arm64 dist
        uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: staging/arm64

      - name: Download x64 dist
        uses: actions/download-artifact@v4
        with:
          name: mac-x64
          path: staging/x64

      - name: Stage assets + merge update metadata
        run: |
          set -euo pipefail
          mkdir -p staging/out
          # Per-arch artifact names never collide (…-<arch>.dmg/.zip).
          cp staging/arm64/*.dmg staging/arm64/*.zip staging/arm64/*.blockmap staging/out/ 2>/dev/null || true
          cp staging/x64/*.dmg   staging/x64/*.zip   staging/x64/*.blockmap   staging/out/ 2>/dev/null || true
          node scripts/merge-mac-latest-yml.mjs \
            staging/out/latest-mac.yml \
            staging/arm64/latest-mac.yml \
            staging/x64/latest-mac.yml
          echo "--- merged latest-mac.yml ---"; cat staging/out/latest-mac.yml
          ls -la staging/out/

      - name: Publish to releases repo
        if: ${{ env.HAS_RELEASES_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          REPO: openxmljson-bit/ElectronRust-Releases
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes "NARIKJSON $TAG"
          gh release upload "$TAG" --repo "$REPO" --clobber staging/out/*
