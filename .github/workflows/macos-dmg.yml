name: macOS DMG (per-arch)

on:
  push:
    tags: ["v*"]           # build/publish on version tags
  workflow_dispatch: {}     # and on-demand from the Actions tab

permissions:
  contents: write           # attach the DMG to a Release on tags

env:
  HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN != '' }}

# Two separate per-architecture jobs (not a matrix), so each shows as its own
# task in the Actions UI. The DuckDB native addon is prebuilt and arch-specific,
# so each DMG is built on a runner of its own arch to pick up the matching
# @duckdb binary (a universal build can't carry both). The shared build steps
# live in the local composite action .github/actions/build-mac.
jobs:
  build-arm64:
    name: Build macOS arm64 (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build & package (arm64)
        uses: ./.github/actions/build-mac
        with:
          arch: arm64
          rust-target: aarch64-apple-darwin
          cert-p12-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          sign-identity: ${{ secrets.MACOS_SIGN_IDENTITY }}
          notary-apple-id: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          notary-password: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          team-id: ${{ secrets.MACOS_TEAM_ID }}
          releases-token: ${{ secrets.RELEASES_REPO_TOKEN }}

  build-x64:
    name: Build macOS x64 (Intel)
    # GitHub retired the Intel macos-13 hosted image, so the x64 DMG is
    # cross-built on an Apple Silicon runner: Rust targets x86_64-apple-darwin,
    # electron-builder packages --x64, and the composite action force-installs the
    # x64 DuckDB binding so the Intel app carries the right native engine.
    runs-on: macos-14
    # Best-effort: this is an untested cross-build (no Intel Mac to verify on), so
    # never let an x64 failure fail the run or block the arm64 release.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build & package (x64)
        uses: ./.github/actions/build-mac
        with:
          arch: x64
          rust-target: x86_64-apple-darwin
          cert-p12-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          sign-identity: ${{ secrets.MACOS_SIGN_IDENTITY }}
          notary-apple-id: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          notary-password: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          team-id: ${{ secrets.MACOS_TEAM_ID }}
          releases-token: ${{ secrets.RELEASES_REPO_TOKEN }}

  # Merge the per-arch update manifests and publish all assets once, so
  # electron-updater serves both architectures from a single latest-mac.yml.
  publish:
    needs: [build-arm64, build-x64]
    # Publish as long as arm64 succeeded — Intel is best-effort and may have
    # failed or been cancelled. always() lets this run even when build-x64 didn't
    # succeed; the x64 artifact download below is tolerant of a missing Intel build.
    if: ${{ always() && needs.build-arm64.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install js-yaml (for the merge script)
        run: npm i js-yaml --no-save --no-audit --no-fund

      - name: Download arm64 dist
        uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: staging/arm64

      - name: Download x64 dist (best-effort — Intel may not have built)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mac-x64
          path: staging/x64

      - name: Stage assets + merge update metadata
        run: |
          set -euo pipefail
          mkdir -p staging/out
          # Per-arch artifact names never collide (…-<arch>.dmg/.zip).
          cp staging/arm64/*.dmg staging/arm64/*.zip staging/arm64/*.blockmap staging/out/ 2>/dev/null || true
          cp staging/x64/*.dmg   staging/x64/*.zip   staging/x64/*.blockmap   staging/out/ 2>/dev/null || true
          node scripts/merge-mac-latest-yml.mjs \
            staging/out/latest-mac.yml \
            staging/arm64/latest-mac.yml \
            staging/x64/latest-mac.yml
          echo "--- merged latest-mac.yml ---"; cat staging/out/latest-mac.yml
          ls -la staging/out/

      - name: Publish to releases repo
        if: ${{ env.HAS_RELEASES_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          REPO: openxmljson-bit/ElectronRust-Releases
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes "NARIKJSON $TAG"
          gh release upload "$TAG" --repo "$REPO" --clobber staging/out/*
