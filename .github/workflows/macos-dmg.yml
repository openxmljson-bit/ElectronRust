name: macOS DMG (per-arch)

on:
  push:
    tags: ["v*"]           # build/publish on version tags
  workflow_dispatch: {}     # and on-demand from the Actions tab

permissions:
  contents: write           # attach the DMG to a Release on tags

env:
  HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
  HAS_NOTARY: ${{ secrets.MACOS_NOTARY_PASSWORD != '' }}
  HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN != '' }}

# Separate per-architecture builds. The DuckDB native addon is prebuilt and
# architecture-specific, so each DMG is built on a runner of its own arch to
# pick up the matching @duckdb binary (a universal build can't carry both).
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14            # Apple Silicon
            rust-target: aarch64-apple-darwin
          - arch: x64
            runner: macos-13            # Intel
            rust-target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Build engine (${{ matrix.arch }})
        run: |
          set -euo pipefail
          cd rust-engine
          cargo build --release --target ${{ matrix.rust-target }}
          mkdir -p target/release
          cp target/${{ matrix.rust-target }}/release/openjsonxml-engine target/release/openjsonxml-engine

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Build DuckDB engine bundle
        run: npm run build:duck

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # ---- signing (only when the cert secrets are configured) ----
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Sign engine binary
        if: env.HAS_CERT == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$SIGN_IDENTITY" \
            rust-engine/target/release/openjsonxml-engine
          codesign -dv rust-engine/target/release/openjsonxml-engine

      # ---- package + publish ----
      # electron-builder signs/notarizes the app (including the unpacked DuckDB
      # addon) and, on a tag with the releases token, publishes the DMG + zip +
      # update metadata to the public ElectronRust-Releases repo.
      - name: Build DMG (${{ matrix.arch }})
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          ARGS="--mac --${{ matrix.arch }}"
          if [ "$HAS_CERT" != "true" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false   # unsigned dev build
          fi
          if [ "$HAS_NOTARY" != "true" ] || [ "$HAS_CERT" != "true" ]; then
            ARGS="$ARGS -c.mac.notarize=false"
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$HAS_RELEASES_TOKEN" = "true" ]; then
            ARGS="$ARGS --publish always"
          else
            ARGS="$ARGS --publish never"
          fi
          npx electron-builder $ARGS
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NARIKJSON-dmg-${{ matrix.arch }}
          path: dist/*.dmg
