[package]
name = "openjsonxml-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1.0"
oxj-core = { path = "oxj-core" }
regex = "1.10"
quick-xml = "0.36"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
